          type: string
        city:
          type: string
        priority:
          type: string
          enum: [low, medium, high, critical]
        tier:
          type: integer
        firecrawl_method:
          type: string
        cron_expression:
          type: string
        is_active:
          type: boolean
        health_score:
          type: number
          format: double
          description: Score de salud (0.0 a 1.0)
        total_runs:
          type: integer
        successful_runs:
          type: integer
        failed_runs:
          type: integer
        last_run_at:
