          format: date-time
          nullable: true
        last_failure_reason:
          type: string
        notes:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DataSourceResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/SourceResponse"

    PaginatedSourcesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SourceResponse"
        meta:
          $ref: "#/components/schemas/Meta"

    # ── Job ──────────────────────────────────────────────

    JobResponse:
      type: object
