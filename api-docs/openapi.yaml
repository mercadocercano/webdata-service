openapi: 3.1.0
info:
  title: Webdata Service API
  description: |
    Servicio de scraping de productos usando Firecrawl.
    Gestiona fuentes de datos, jobs de scraping, productos scrapeados y estadisticas del pipeline.
    Multi-tenant con aislamiento por X-Tenant-ID.
  version: 1.0.0
  contact:
    name: Mercado Cercano
    url: https://mercadocercano.com

servers:
  - url: http://localhost:8150
    description: Desarrollo local (directo)
  - url: http://localhost:8001/webdata
    description: Desarrollo local (via Kong Gateway)

security:
  - BearerAuth: []
    TenantHeader: []

tags:
  - name: Health
    description: Health check del servicio
  - name: Sources
    description: CRUD de fuentes de scraping y trigger manual
  - name: Jobs
    description: Gestion de scraping jobs
  - name: Products
    description: Productos scrapeados, sync a PIM, business types y operaciones bulk
  - name: Business Types
    description: Proxy a pim-service para listar business types
  - name: Stats
    description: Estadisticas del pipeline y salud de fuentes
  - name: Enrichment
    description: Enrichment de productos con imagenes y atributos via IA

paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      tags: [Health]
      security: []
      responses:
        "200":
          description: Servicio saludable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: webdata-service

  # ── Sources ──────────────────────────────────────────────

  /api/v1/sources:
    get:
      operationId: listSources
      summary: Listar fuentes de scraping
      tags: [Sources]
      parameters:
        - $ref: "#/components/parameters/XTenantID"
        - name: category
          in: query
          schema:
            type: string
          description: Filtrar por categoria (business type)
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Lista paginada de fuentes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedSourcesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: createSource
      summary: Crear una fuente de scraping
      tags: [Sources]
      parameters:
        - $ref: "#/components/parameters/XTenantID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSourceRequest"
      responses:
        "201":
          description: Fuente creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/sources/{id}:
    get:
      operationId: getSource
      summary: Obtener una fuente por ID
      tags: [Sources]
      parameters:
        - $ref: "#/components/parameters/XTenantID"
        - $ref: "#/components/parameters/PathID"
      responses:
        "200":
          description: Fuente encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      operationId: updateSource
      summary: Actualizar una fuente (parcial)
      tags: [Sources]
      parameters:
        - $ref: "#/components/parameters/XTenantID"
        - $ref: "#/components/parameters/PathID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSourceRequest"
      responses:
        "200":
          description: Fuente actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

    delete:
      operationId: deleteSource
      summary: Eliminar una fuente
      tags: [Sources]
      parameters:
        - $ref: "#/components/parameters/XTenantID"
        - $ref: "#/components/parameters/PathID"
      responses:
        "204":
          description: Fuente eliminada
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/sources/{id}/trigger:
    post:
      operationId: triggerScrape
      summary: Disparar scraping manual de una fuente
      tags: [Sources]
      parameters:
        - $ref: "#/components/parameters/XTenantID"
        - $ref: "#/components/parameters/PathID"
      responses:
        "201":
          description: Job de scraping creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataJobResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  # ── Jobs ─────────────────────────────────────────────────

  /api/v1/jobs:
    get:
      operationId: listJobs
      summary: Listar scraping jobs
      tags: [Jobs]
      parameters:
        - $ref: "#/components/parameters/XTenantID"
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, running, completed, failed, cancelled]
          description: Filtrar por estado del job
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Lista paginada de jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedJobsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/jobs/{id}:
    get:
      operationId: getJob
      summary: Obtener un job por ID
      tags: [Jobs]
      parameters:
        - $ref: "#/components/parameters/XTenantID"
        - $ref: "#/components/parameters/PathID"
      responses:
        "200":
          description: Job encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataJobResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/jobs/{id}/cancel:
    post:
      operationId: cancelJob
      summary: Cancelar un job en ejecucion
      tags: [Jobs]
      parameters:
        - $ref: "#/components/parameters/XTenantID"
        - $ref: "#/components/parameters/PathID"
      responses:
        "204":
          description: Job cancelado
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/jobs/{id}/retry:
    post:
      operationId: retryJob
      summary: Reintentar un job fallido
      tags: [Jobs]
      parameters:
        - $ref: "#/components/parameters/XTenantID"
        - $ref: "#/components/parameters/PathID"
      responses:
        "201":
          description: Nuevo job creado como reintento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataJobResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  # ── Products ─────────────────────────────────────────────

  /api/v1/products:
    get:
      operationId: listProducts
      summary: Listar productos scrapeados
      tags: [Products]
      parameters:
        - $ref: "#/components/parameters/XTenantID"
        - name: category
          in: query
          schema:
            type: string
          description: Filtrar por categoria
        - name: brand
          in: query
          schema:
            type: string
          description: Filtrar por marca
        - name: business_type
          in: query
          schema:
            type: string
          description: Filtrar por codigo de business type
        - name: q
          in: query
          schema:
            type: string
          description: Busqueda por texto libre (titulo, marca, SKU)
        - name: source_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filtrar por ID de fuente
        - name: sort_by
          in: query
          schema:
            type: string
          description: Campo para ordenar resultados
        - name: sort_order
          in: query
          schema:
            type: string
            enum: [asc, desc]
          description: Orden ascendente o descendente
        - name: without_image
          in: query
          schema:
            type: string
            enum: ["true", "false"]
          description: Solo productos sin imagen
        - name: not_synced
          in: query
          schema:
            type: string
            enum: ["true", "false"]
          description: Solo productos no sincronizados a PIM
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Lista paginada de productos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedProductsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/products/filters:
    get:
      operationId: getProductFilters
      summary: Obtener filtros disponibles para productos
      tags: [Products]
      parameters:
        - $ref: "#/components/parameters/XTenantID"
      responses:
        "200":
          description: Filtros disponibles
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ProductFilters"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/products/sync-to-pim:
    post:
      operationId: syncToPIM
      summary: Sincronizar productos pendientes a PIM
      tags: [Products]
      parameters:
        - $ref: "#/components/parameters/XTenantID"
        - name: source_name
          in: query
          schema:
            type: string
          description: Filtrar por nombre de fuente (opcional)
      responses:
        "200":
          description: Resultado de la sincronizacion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncToPIMResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/products/bulk-delete:
    post:
      operationId: bulkDeleteProducts
      summary: Eliminar multiples productos
      tags: [Products]
      parameters:
        - $ref: "#/components/parameters/XTenantID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkDeleteRequest"
      responses:
        "200":
          description: Productos eliminados
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: integer
                    format: int64
                    description: Cantidad de productos eliminados
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/products/bulk-assign-business-type:
    post:
      operationId: bulkAssignBusinessType
      summary: Asignar un business type a multiples productos
      tags: [Products]
      parameters:
        - $ref: "#/components/parameters/XTenantID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkAssignBusinessTypeRequest"
      responses:
        "200":
          description: Resultado de la asignacion masiva
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkAssignBusinessTypeResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/products/auto-assign-business-types:
    post:
      operationId: autoMatchBusinessTypes
      summary: Auto-detectar business types para productos por categoria/titulo
      tags: [Products]
      parameters:
        - $ref: "#/components/parameters/XTenantID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoMatchRequest"
      responses:
        "200":
          description: Propuestas de match generadas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoMatchResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/products/enrich-from-global-catalog:
    post:
      operationId: enrichFromGlobalCatalog
      summary: Enriquecer productos del catalogo global via scraping
      description: |
        Consulta PIM por productos incompletos (sin precio o imagen) y crea
        scraping jobs para las fuentes activas del business type correspondiente.
      parameters:
        - name: business_type
          in: query
          schema:
            type: string
          description: Filtrar por business type especifico
      responses:
        "200":
          description: Resultado del enrichment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrichGlobalProductsResult"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Use case de enrichment no inicializado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/products/{id}:
    get:
      operationId: getProduct
      summary: Obtener un producto por ID
      tags: [Products]
      parameters:
        - $ref: "#/components/parameters/XTenantID"
        - $ref: "#/components/parameters/PathID"
      responses:
        "200":
          description: Producto encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataProductResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      operationId: patchProduct
      summary: Actualizar producto (bloquear/desbloquear)
      tags: [Products]
      parameters:
        - $ref: "#/components/parameters/XTenantID"
        - $ref: "#/components/parameters/PathID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_blocked]
              properties:
                is_blocked:
                  type: boolean
                  description: Marcar producto como bloqueado
      responses:
        "204":
          description: Producto actualizado
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deleteProduct
      summary: Eliminar un producto
      tags: [Products]
      parameters:
        - $ref: "#/components/parameters/XTenantID"
        - $ref: "#/components/parameters/PathID"
      responses:
        "204":
          description: Producto eliminado
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/products/{id}/price-history:
    get:
      operationId: getPriceHistory
      summary: Historial de precios de un producto
      tags: [Products]
      parameters:
        - $ref: "#/components/parameters/XTenantID"
        - $ref: "#/components/parameters/PathID"
      responses:
        "200":
          description: Historial de precios
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PriceHistoryRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/products/{id}/business-types:
    put:
      operationId: assignBusinessTypes
      summary: Asignar business types a un producto (reemplaza existentes)
      tags: [Products]
      parameters:
        - $ref: "#/components/parameters/XTenantID"
        - $ref: "#/components/parameters/PathID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignBusinessTypesRequest"
      responses:
        "204":
          description: Business types asignados
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/products/{id}/business-types/{code}:
    delete:
      operationId: removeBusinessType
      summary: Remover un business type de un producto
      tags: [Products]
      parameters:
        - $ref: "#/components/parameters/XTenantID"
        - $ref: "#/components/parameters/PathID"
        - name: code
          in: path
          required: true
          schema:
            type: string
          description: Codigo del business type a remover
      responses:
        "204":
          description: Business type removido
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Business Types ───────────────────────────────────────

  /api/v1/business-types:
    get:
      operationId: listBusinessTypes
      summary: Listar business types (proxy a pim-service)
      tags: [Business Types]
      parameters:
        - $ref: "#/components/parameters/XTenantID"
      responses:
        "200":
          description: Lista de business types desde pim-service
          content:
            application/json:
              schema:
                type: object
                description: Respuesta proxied directamente desde pim-service
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          description: pim-service no disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Stats ────────────────────────────────────────────────

  /api/v1/stats:
    get:
      operationId: getStats
      summary: Estadisticas generales del pipeline
      tags: [Stats]
      parameters:
        - $ref: "#/components/parameters/XTenantID"
      responses:
        "200":
          description: Estadisticas generales
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/StatsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/stats/sources:
    get:
      operationId: getSourceStats
      summary: Estadisticas por fuente
      tags: [Stats]
      parameters:
        - $ref: "#/components/parameters/XTenantID"
      responses:
        "200":
          description: Estadisticas de cada fuente
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SourceStatsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/stats/pipeline:
    get:
      operationId: getPipelineStatus
      summary: Estado del pipeline por business type
      tags: [Stats]
      parameters:
        - $ref: "#/components/parameters/XTenantID"
        - name: business_type
          in: query
          required: true
          schema:
            type: string
          description: Business type para consultar el pipeline
      responses:
        "200":
          description: Estado del pipeline
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PipelineStatusResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Enrichment ───────────────────────────────────────────

  /api/v1/enrichment/run:
    post:
      operationId: runEnrichmentBatch
      summary: Ejecutar batch de enrichment
      description: Lanza el proceso de enrichment (imagen + atributos) sobre el lote de productos pendientes del tenant
      tags: [Enrichment]
      parameters:
        - $ref: "#/components/parameters/XTenantID"
      responses:
        "200":
          description: Resultado del enrichment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrichmentResultResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          description: Use case de enrichment no inicializado o error interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/enrichment/status:
    get:
      operationId: getEnrichmentStatus
      summary: Obtener estado del enrichment
      description: Retorna estadisticas del pipeline de enrichment para el tenant (productos pendientes, procesados, fallidos)
      tags: [Enrichment]
      parameters:
        - $ref: "#/components/parameters/XTenantID"
      responses:
        "200":
          description: Estado del enrichment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrichmentStatusResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/enrichment/reject:
    post:
      operationId: rejectEnrichmentImage
      summary: Rechazar imagen de enrichment
      description: Marca una imagen enriquecida como rechazada para que sea descartada o reprocesada
      tags: [Enrichment]
      parameters:
        - $ref: "#/components/parameters/XTenantID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id]
              properties:
                product_id:
                  type: string
                  format: uuid
                  description: ID del producto cuya imagen se rechaza
                reason:
                  type: string
                  description: Motivo del rechazo
      responses:
        "200":
          description: Imagen rechazada exitosamente
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT emitido por iam-service

    TenantHeader:
      type: apiKey
      in: header
      name: X-Tenant-ID
      description: UUID del tenant

  parameters:
    XTenantID:
      name: X-Tenant-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: UUID del tenant

    PathID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID del recurso

    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
      description: Numero de pagina

    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
      description: Cantidad de elementos por pagina

  responses:
    BadRequest:
      description: Solicitud invalida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    UnprocessableEntity:
      description: Error de validacion de negocio
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    InternalError:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    # ── Common ───────────────────────────────────────────

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Mensaje de error

    Meta:
      type: object
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer

    # ── Source ────────────────────────────────────────────

    CreateSourceRequest:
      type: object
      required: [name, base_url, category, source_type, priority, tier]
      properties:
        name:
          type: string
          description: Nombre descriptivo de la fuente
          example: "Ferreteria Rex - Herramientas"
        base_url:
          type: string
          format: uri
          description: URL base para scraping
          example: "https://ferreteriarex.com.ar/herramientas"
        category:
          type: string
          description: Categoria/business type de la fuente
          example: "ferreteria"
        source_type:
          type: string
          description: Tipo de fuente (ecommerce, catalog, etc)
          example: "ecommerce"
        city:
          type: string
          description: Ciudad de la fuente
          example: "Buenos Aires"
        priority:
          type: string
          enum: [low, medium, high, critical]
          description: Prioridad de scraping
          example: "medium"
        tier:
          type: integer
          minimum: 1
          maximum: 3
          description: Nivel de la fuente (1=premium, 2=standard, 3=basic)
          example: 2
        firecrawl_method:
          type: string
          enum: [extract, scrape, crawl]
          description: Metodo de Firecrawl a usar (default extract)
          example: "extract"
        cron_expression:
          type: string
          description: Expresion cron para scraping programado
          example: "0 6 * * 1"
        notes:
          type: string
          description: Notas adicionales
        extraction_schema:
          type: object
          description: Schema JSON para extraccion LLM-powered de Firecrawl
        crawl_config:
          $ref: "#/components/schemas/CrawlConfig"

    UpdateSourceRequest:
      type: object
      properties:
        name:
          type: string
        base_url:
          type: string
          format: uri
        category:
          type: string
        city:
          type: string
        priority:
          type: string
          enum: [low, medium, high, critical]
        tier:
          type: integer
          minimum: 1
          maximum: 3
        firecrawl_method:
          type: string
          enum: [extract, scrape, crawl]
        cron_expression:
          type: string
        notes:
          type: string
        is_active:
          type: boolean
        extraction_schema:
          type: object
        crawl_config:
          $ref: "#/components/schemas/CrawlConfig"

    CrawlConfig:
      type: object
      properties:
