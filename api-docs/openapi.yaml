        url_patterns:
          type: array
          items:
            type: string
          description: Patrones de URL a seguir
        max_pages:
          type: integer
          description: Maximo de paginas a crawlear
        page_param:
          type: string
          description: Parametro de paginacion en la URL (default "page")
        ignore_robots:
          type: boolean
          description: Ignorar robots.txt

    SourceResponse:
      type: object
